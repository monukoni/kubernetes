appName: "backend"

replicaCount: 3

serviceAccount:
  name: "backend"


podLabels: {
  tier: backend
}

deploymentLabels: {
  tier: backend
}

service:
  name: backend
  type: ClusterIP
  port: 80
  targetPort: 80

container:
  name: backend
  port: 80
  image:
    repository: 465760687279.dkr.ecr.eu-central-1.amazonaws.com/backend
    tag: latest
  healthEndpoint: /healthz
  healthPort: 80
  resources:
    requests:
      cpu: "100m"
    limits:
      cpu: "250m"

